[project]
name = "mailmind-ai"
version = "1.2.0"
description = "OpenEnv RL Email Assistant"
authors = [{name = "Bhavyansh Parihar"}]
requires-python = ">=3.10, <3.14"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "gymnasium",
    "pandas",
    "matplotlib",
    "openai",
    "google-generativeai",
    "pyyaml",
    "streamlit",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build_meta"
